name: Godot CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GODOT_VERSION: "4.2.1"
  EXPORT_NAME: "game-release"

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdtoolkit
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Code Formatting Check
        run: gdformat --check .

      - name: Static Analysis (Linter)
        run: gdlint .

  run-tests:
    name: Headless Testing
    runs-on: ubuntu-latest
    needs: lint-and-format
    container:
      image: barichello/godot-ci:4.2.1-stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Editor (Imports Assets)
        run: |
          mkdir -p ~/.local/share/godot/templates/
          godot --headless --path . --editor --quit

      - name: Run GUT Tests
        run: |
          godot --headless --path . -s addons/gut/gut_cmdline.gd -gdir=res://tests -gexit

  export-project:
    name: Export Build
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.ref == 'refs/heads/main'
    container:
      image: barichello/godot-ci:4.2.1-stable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable ~/.local/share/godot/export_templates/

      - name: Create Build Directories
        run: |
          mkdir -v -p build/linux
          mkdir -v -p build/windows
          mkdir -v -p build/web

      - name: Export Linux Build
        run: godot --headless --path . --export-release "Linux/X11" build/linux/${{ env.EXPORT_NAME }}.x86_64

      - name: Export Windows Build
        run: godot --headless --path . --export-release "Windows Desktop" build/windows/${{ env.EXPORT_NAME }}.exe

      - name: Export Web Build
        run: godot --headless --path . --export-release "Web" build/web/index.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-builds
          path: build/
