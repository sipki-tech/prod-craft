# Starter EasyP v1 generation config — copy to the repo root as easyp.gen.yaml.
# One deterministic pass for messages, gRPC, gateway, and OpenAPI. Remote plugins
# must pin `version`. protovalidate validates at runtime (CEL) and needs no
# generator plugin, only the require in protobuf.mod.
# buf fallback: ./buf.gen.yaml. See ../references/toolkit/codegen.md.
version: v1

plugins:
  - remote: plugins.beta.easyp.tech/protocolbuffers/go
    version: v1.36.11
    out: api
    opts:
      paths: source_relative
  - remote: plugins.beta.easyp.tech/grpc/go
    version: v1.6.2
    out: api
    opts:
      paths: source_relative
      require_unimplemented_servers: false
  - remote: plugins.beta.easyp.tech/grpc-ecosystem/gateway
    version: v2.29.0
    out: api
    opts:
      paths: source_relative
  - remote: plugins.beta.easyp.tech/grpc-ecosystem/openapiv2
    version: v2.29.0
    out: api
    opts:
      generate_unbound_methods: false
