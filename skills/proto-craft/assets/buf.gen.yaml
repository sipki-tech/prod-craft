# buf FALLBACK for the EasyP `generate` block (see ../references/toolkit/codegen.md).
# Use only if migrating from buf. The primary config lives in ./easyp.yaml.
# Pin plugin versions to current releases for deterministic, reproducible output.
version: v2

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - remote: buf.build/grpc-ecosystem/gateway:v2.26.3
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.26.3
    out: gen

# protovalidate validates at runtime (CEL); it has NO generator plugin —
# depend on buf.build/bufbuild/protovalidate for the buf/validate import and
# enforce with one interceptor (see ../references/integration/protovalidate.md).
#
# Legacy alternative — generates *.pb.validate.go (protoc-gen-validate):
#   - remote: buf.build/bufbuild/validate-go:v1.2.1
#     out: gen
#     opt: paths=source_relative
