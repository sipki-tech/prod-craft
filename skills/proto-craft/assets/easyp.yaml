# Starter EasyP config — the primary proto-craft toolchain.
# See ../references/toolkit/easyp.md, lint.md, breaking.md, codegen.md.
# buf fallback: split this into buf.yaml (deps + lint + breaking) and
# buf.gen.yaml (plugins, see ./buf.gen.yaml).
version: v1alpha

# External proto modules: well-known types, HTTP annotations, validation.
# Fetched into a lock file by `easyp mod download` — never hand-vendor protos.
deps:
  - github.com/googleapis/googleapis
  - github.com/grpc-ecosystem/grpc-gateway
  - github.com/bufbuild/protovalidate

# Lint: adopt the curated default set; opt out per-rule, with a documented reason.
lint:
  use:
    - DEFAULT
  # except:
  #   - PACKAGE_VERSION_SUFFIX   # only with a written justification

# Breaking-change detection is invoked from CI against a baseline ref:
#   easyp breaking --against origin/main
# buf fallback (in buf.yaml):
#   breaking:
#     use:
#       - WIRE_JSON

# Codegen: one deterministic pass for messages, gRPC, gateway, and OpenAPI.
# Pin plugin versions for reproducible output. protovalidate validates at
# runtime (CEL) and needs no generator plugin — just the dep above.
generate:
  inputs:
    - directory: api
  plugins:
    - remote: api.beta.easyp.tech/protocolbuffers/go:v1.36.10
      out: .
      opts:
        paths: source_relative
    - remote: api.beta.easyp.tech/grpc/go
      out: .
      opts:
        paths: source_relative
        require_unimplemented_servers: false
    - remote: api.beta.easyp.tech/grpc-ecosystem/gateway
      out: .
      opts:
        paths: source_relative
    - remote: api.beta.easyp.tech/grpc-ecosystem/openapiv2
      out: .
      opts:
        generate_unbound_methods: false
